<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Secure File Manager
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<nav>
    <div class="nav-container">

        <div class="logo">
            Secure File Manager
        </div>

        {% if session.get("user_id") %}

        <div class="nav-right">

            <span>
                {{ session.get("username") }}
            </span>

            <form
                action="{{ url_for('logout') }}"
                method="POST"
                class="inline-form"
            >

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <button
                    type="submit"
                    class="logout-button"
                >
                    Logout
                </button>

            </form>

        </div>

        {% endif %}

    </div>
</nav>


<main>

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    {% block content %}
    {% endblock %}

</main>

</body>
</html>
